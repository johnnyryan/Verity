<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif">
  <rect width="1400" height="640" fill="#ffffff"/>

  <defs>
    <filter id="inset-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feFlood flood-color="rgba(0, 13, 27, 0.18)" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="out" result="outerColor"/>
      <feGaussianBlur in="outerColor" stdDeviation="3" result="blurred"/>
      <feOffset in="blurred" dx="0" dy="2" result="offsetBlurred"/>
      <feComposite in="offsetBlurred" in2="SourceAlpha" operator="in" result="innerShadow"/>
      <feComposite in="SourceGraphic" in2="innerShadow" operator="over"/>
    </filter>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blurred"/>
      <feOffset in="blurred" dx="0" dy="6" result="offset"/>
      <feFlood flood-color="rgba(0, 13, 27, 0.08)" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

